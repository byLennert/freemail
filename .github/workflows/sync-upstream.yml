name: 🔄 Sync with Upstream

on:
  # ⚠️ 已改为「仅手动触发」。
  #
  # 原本这里有一个每日定时任务（UTC 00:00 / 北京时间 08:00），会把上游
  # idinging/freemail 自动合并进本仓库的 master。
  # 但本仓库带有自己的补丁（例如 src/email/handler.js 的 RFC 2047 主题解码、
  # 以及 deploy-cloudflare.yml 的触发分支修正），一旦上游改动同一文件，
  # 自动合并就会冲突、任务失败。
  #
  # 所以改为手动：需要跟进上游时，到 Actions 页面点 Run workflow。
  # 想恢复自动同步，把下面两行取消注释即可。
  #
  # schedule:
  #   - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync_with_upstream:
    name: 🔄 Sync master with upstream latest
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout target repo
        uses: actions/checkout@v4

      - name: 🔄 Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          # 上游仓库的名称
          upstream_sync_repo: idinging/freemail
          # 上游想要同步的分支
          upstream_sync_branch: master
          # 自己仓库要被更新的分支
          target_sync_branch: master
          # 自动注入的 GitHub Token（需要赋予 Actions 读写权限）
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

          # 设为 false 表示真正执行同步（如果设为 true 则只测试不推送）
          test_mode: false

      - name: ❌ 通知同步失败 / Check for Failure
        if: failure()
        run: |
          echo "❌ 同步失败！通常是因为你本地修改的文件与上游产生了冲突（Merge Conflicts）。"
          echo "请在本地拉取代码并手动解决冲突后再次推送。"
